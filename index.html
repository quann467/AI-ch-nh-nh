<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Chỉnh Ảnh</title>
</head>
<body>

<h1>AI Chỉnh Ảnh</h1>

<input type="file" id="image"><br><br>

<input type="text" id="prompt"
placeholder="Ví dụ: Đổi nền thành bãi biển"><br><br>

<button onclick="runAI()">Chỉnh Ảnh</button>

<p id="status"></p>

<script>
function runAI() {
    let prompt =
    document.getElementById("prompt").value;

    document.getElementById("status").innerHTML =
    "Yêu cầu của bạn: " + prompt +
    "<br><br>Chưa kết nối AI thật.";
}
</script>

</body>
</html>
