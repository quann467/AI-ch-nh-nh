<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Chỉnh Ảnh</title>
</head>
<body>
    <h1>AI Chỉnh Ảnh</h1>

    <input type="file" id="image"><br><br>

    <input type="text" id="prompt"
           placeholder="Nhập yêu cầu chỉnh ảnh"><br><br>

    <button onclick="editImage()">Chỉnh Ảnh</button>

    <p id="status"></p>

    <script>
    async function editImage() {
        document.getElementById("status").innerText =
        "Cần kết nối API AI ở bước tiếp theo";
    }
    </script>
</body>
</html>
